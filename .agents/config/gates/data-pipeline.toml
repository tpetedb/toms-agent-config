# =============================================================================
# config/gates/data-pipeline.toml: the gate pack for project.kind = "data-pipeline".
# A data pipeline: the schema does not drift unannounced, and data quality is checked once Q13 allows it.
# The pack is the minimum the project promises on top of the standards
# registry, not a certificate of production readiness. Each check is an argv
# run without a shell; argv[0] is `just`, and the project's justfile provides
# the recipe. A pack never requires a deferred tool: such a check is written
# with enabled = false and the open question it waits on. Unknown keys fail loudly.
# =============================================================================
# The layout of this file; tac migrate moves an older one forward.
schema_version = 1
# Must equal the file name; [project] kind in .agents/config.toml picks the pack:
# app | tool | library | data-pipeline | document | mixed.
kind = "data-pipeline"
# One line on what a project of this kind ships.
description = "A pipeline that moves or reshapes data."
# Other packs whose checks also apply, by kind: app | tool | library | data-pipeline | document.
includes = []

# The output schema matches the declared one.
[checks.schema-drift]
argv = ["just", "gate-schema-drift"]    # the command, run without a shell; argv[0] is just
why = "a schema drift check against the declared contract"   # what the check proves, printed when it fails
enabled = true                          # false only while a deferred tool waits on waits_on
waits_on = ""                           # the open question a disabled check waits on, like Q13; empty when enabled

# The data-quality scan passes.
[checks.soda-scan]
argv = ["just", "gate-soda-scan"]       # the command, run without a shell; argv[0] is just
why = "the Soda scan, an opt-in extra until the owner answers Q13"   # what the check proves, printed when it fails
enabled = false                         # false only while a deferred tool waits on waits_on
waits_on = "Q13"                        # the open question a disabled check waits on, like Q13; empty when enabled
