# =============================================================================
# config/gates/document.toml: the gate pack for project.kind = "document".
# A document: its Markdown lints and its diagrams render.
# The pack is the minimum the project promises on top of the standards
# registry, not a certificate of production readiness. Each check is an argv
# run without a shell; argv[0] is `just`, and the project's justfile provides
# the recipe. A pack never requires a deferred tool: such a check is written
# with enabled = false and the open question it waits on. Unknown keys fail loudly.
# =============================================================================
# The layout of this file; tac migrate moves an older one forward.
schema_version = 1
# Must equal the file name; [project] kind in .agents/config.toml picks the pack:
# app | tool | library | data-pipeline | document | mixed.
kind = "document"
# One line on what a project of this kind ships.
description = "Documents and diagrams for readers."
# Other packs whose checks also apply, by kind: app | tool | library | data-pipeline | document.
includes = []

# The Markdown lints.
[checks.markdown]
argv = ["just", "gate-markdown"]        # the command, run without a shell; argv[0] is just
why = "rumdl over every Markdown file; vale joins in release 1.1"   # what the check proves, printed when it fails
enabled = true                          # false only while a deferred tool waits on waits_on
waits_on = ""                           # the open question a disabled check waits on, like Q13; empty when enabled

# Every diagram renders.
[checks.diagrams]
argv = ["just", "diagrams-render"]      # the command, run without a shell; argv[0] is just
why = "the pinned mermaid-cli render loop proves each diagram's syntax"   # what the check proves, printed when it fails
enabled = true                          # false only while a deferred tool waits on waits_on
waits_on = ""                           # the open question a disabled check waits on, like Q13; empty when enabled
