# =============================================================================
# config/hooks.toml: what the harness hooks run (layer 2, design section 9).
# Every rendered hook calls the stamped guard, never the source hooks/run.py,
# with absolute trusted executables, a fixed environment and `python -I`, so a
# module, a PATH shim or a project config an agent wrote changes nothing about
# what runs (build condition C2). Hooks are reminders and early refusals; CI
# and the ruleset are the gate. tac sync renders the checks below into
# .claude/settings.json and .codex/hooks.json, one hook per event and matcher.
# Unknown keys fail loudly.
# =============================================================================
# The layout of this file; tac migrate moves an older one forward.
schema_version = 1

# ---- guard: how a hook starts the guard.
[guard]
script = ".agents/hooks/run.py"           # the stamped guard, relative to the repository root; never the source hooks/run.py
python = "/usr/bin/python3"               # an absolute interpreter the owner trusts; macOS ships 3.9 there, and the guard is 3.9 compatible
isolated = true                           # run Python with -I: no script directory, no user site-packages, PYTHON* ignored
# The only PATH a hook command sees: absolute system folders, never a project one.
path = ["/usr/bin", "/bin", "/usr/sbin", "/sbin"]
deadline_s = 8                            # the guard's own deadline, kept under timeout_s so it answers before the client gives up
timeout_s = 10                            # the hook timeout rendered for the client; a timed-out Claude hook lets the call continue

# ---- checks: one table per guard check. For each:
#   event: when it fires, PreToolUse | PostToolUse | SessionStart | SubagentStart | Stop;
#   kind: deny (exit 2 refuses the call) | reminder (exit 0 with a message) | record (exit 0, journals only);
#   claude, codex: the tool matcher on that client, by the tool names its hook
#   docs give; empty means not wired on that client. A record check renders no
#   hook until the worker store journal exists (M3).

# An edit outside the paths the current order owns.
[checks.owned-paths]
event = "PreToolUse"                      # PreToolUse | PostToolUse | SessionStart | SubagentStart | Stop
kind = "deny"                             # deny | reminder | record
claude = "Edit|Write|MultiEdit|NotebookEdit"   # Claude's file-editing tools
codex = "apply_patch"                     # Codex edits files through apply_patch; the check reads the patch's file headers

# A read of a secret: *.env, secrets folders, keys, cloud credentials.
[checks.secret-read]
event = "PreToolUse"                      # PreToolUse | PostToolUse | SessionStart | SubagentStart | Stop
kind = "deny"                             # deny | reminder | record
claude = "Read|Grep|Glob"                 # Claude's reading tools
codex = ""                                # not wired: Codex reads through its shell, which names no path to check

# An edit to a path generated.lock lists: regenerate with tac sync instead.
[checks.generated-paths]
event = "PreToolUse"                      # PreToolUse | PostToolUse | SessionStart | SubagentStart | Stop
kind = "deny"                             # deny | reminder | record
claude = "Edit|Write|MultiEdit|NotebookEdit"   # Claude's file-editing tools
codex = "apply_patch"                     # Codex edits files through apply_patch; the check reads the patch's file headers

# A native spawn the guard cannot vouch for (section 5): any spawn tool used by a
# role whose charter says delegates = false, any of them under native_delegation =
# "off", and a Workflow call whose script a stage of the caller's role does not
# register with its sha256 in generated.lock. Single-use dispatch tokens join in M3.
[checks.handoff-guard]
event = "PreToolUse"                      # PreToolUse | PostToolUse | SessionStart | SubagentStart | Stop
kind = "deny"                             # deny | reminder | record
claude = "Agent|Task|Workflow"            # the subagent tool under its current and former names, and Workflow, which starts a dynamic workflow
codex = "spawn_agent"                     # Codex's subagent tool

# A subagent start, recorded only: SubagentStart cannot block in either client.
[checks.spawn-record]
event = "SubagentStart"                   # PreToolUse | PostToolUse | SessionStart | SubagentStart | Stop
kind = "record"                           # deny | reminder | record
claude = "*"                              # every subagent start
codex = "*"                               # every subagent start

# A session that stops with its order's acceptance still failing.
[checks.order-check]
event = "Stop"                            # PreToolUse | PostToolUse | SessionStart | SubagentStart | Stop
kind = "reminder"                         # deny | reminder | record
claude = "*"                              # every stop
codex = "*"                               # every stop

# ---- git: the prek hooks hooks/git/prek.toml defines (layer 3a), by id, in the
# order they run. tac check fails when the two disagree; `just hooks-install`
# installs them, on the host or by the runner, never in an agent sandbox.
[git]
# Before a commit: format and lint, the staged check, TODO.HUMAN.md against its
# render when the page or .human/ is staged, the private-term scan.
pre_commit = ["ruff-format", "ruff-check", "tac-check-staged", "human-render-check", "private-scan"]
# The message against [commits] in config/standards.toml, then the private-term
# scan of the message, which the commit publishes.
commit_msg = ["tac-check-commit-msg", "private-scan-message"]
pre_push = ["fast-tests", "tac-check"]    # the fast tests and the full check before anything leaves the machine
