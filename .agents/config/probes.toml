# Client probes the runner runs for `tac receipt client --harness <h> --probe <name>`.
# The runner reads this file as committed at the revision it observes, the one the
# receipt's policy hash covers, and starts only the harness's own executable: a
# probe names what to observe, never a command line.
schema_version = 1

# Discovery: is the client installed, and which version.
[probes.version]
description = "Discovery: the client is installed and reports its version."   # printed in the receipt
kind = "version"                          # what the runner observes: version | trust
expect_exit = 0                           # the exit status the probe must see for the receipt to pass

# Trust: does the client trust this checkout.
[probes.trust]
description = "Trust: the client accepts this checkout (workspace trust in Claude Code, trust_level in Codex)."   # printed in the receipt
kind = "trust"                            # what the runner observes: version | trust
expect_exit = 0                           # the exit status the probe must see for the receipt to pass
