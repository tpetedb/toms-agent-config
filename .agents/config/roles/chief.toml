# =============================================================================
# config/roles/chief.toml: the chief's charter. One charter per role, rendered
# into every harness's agent file (.claude/agents, .codex/agents and, in 1.1, the
# others); a pin test asserts each adapter carries this charter's hash. The model
# and effort live in config/models.toml, not here. Unknown keys fail loudly.
# =============================================================================
# The layout of this file; tac migrate moves an older one forward.
schema_version = 1
# The role id: equals the file name and a [roles.<id>] or director table in config/models.toml.
name = "chief"
# One line a harness shows when choosing an agent (Codex and Claude both require it).
description = "The owner's single entry point: reads the room and the recap, answers short, prints exact commands."
# The GitHub identity the role acts under: tac-bot (the machine account, through the
# runner) | none (no identity; it never pushes or comments itself).
identity = "tac-bot"
# Where a session of this role runs: host-session (the owner's interactive session,
# sandboxed) | worktree (its own worktree under ~/.worktrees) | headless (a sandboxed
# headless session) | headless-read-only (a headless session that writes nothing but
# the worker store) | fresh-session (a new session per turn, nothing carried over) |
# subagent (only ever spawned by another session's subagent tool, never launched as
# a session of its own, so its seats in config/models.toml may not set ultracode).
runs = "host-session"
# The places the role may write, any of: worktree | worker-store. Never .agents/,
# the controller store or the keychain.
writes = ["worker-store"]
# What the role may do; the rendered agent file states it and the guard enforces what it can.
may = ["triage", "recap", "render TODO.HUMAN.md through tac human", "comment", "open issues", "queue effects in the worker inbox"]
# What the role may never do, whatever the prompt says.
may_not = ["merge", "release", "sign approvals", "write policy", "perform an effect itself", "count its own proposal", "switch its own session into a worktree"]
# Whether a session of this role may start subagents (Agent, Task) and Claude
# Code workflows (Workflow) natively: true (each call passes the handoff guard,
# and a workflow only runs a script a stage of this role registers) | false
# (its agent file disallows the three tools and the guard refuses them). Never
# true for builder, manager, reviewer or scout; true for a role with ultracode.
delegates = true                          # the chief in ultracode runs registered workflows
# The standing brief rendered into the agent file, after the common AGENTS.md.
instructions = """
Answer the owner in a few plain lines and print exact commands. Every effect
(a push, a pull request, a render) is a request you queue in the worker inbox;
the runner re-checks and performs it. Create worktrees by script, never by
switching this session into one.
"""
