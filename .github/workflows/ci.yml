# Judges every pull request with a read-only token. Never pull_request_target:
# a head checkout with a write token would let a candidate run with trust.
name: ci

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync the candidate environment
        run: uv sync --frozen
      - name: Build the deployed toolchain from its named source
        run: uv sync --frozen --no-editable --project .agents
      - name: Workflow lint
        run: uv run --frozen actionlint
      - name: Shell lint
        run: uv run --frozen shellcheck bootstrap.sh scripts/*.sh
      - name: Ruff lint
        run: uv run --frozen ruff check .
      - name: Ruff format
        run: uv run --frozen ruff format --check .
      - name: Types
        run: uv run --frozen basedpyright
      - name: Tests
        run: uv run --frozen pytest -q
      - name: Private scan
        run: bash scripts/private_scan.sh
