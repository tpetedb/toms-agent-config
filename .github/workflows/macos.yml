# The Seatbelt confinement tests on a macOS runner, where /usr/bin/sandbox-exec
# exists; on ci.yml's Linux runner they skip. Not a required check: the ruleset
# requires ci.yml's jobs only (REQUIRED_CHECKS in src/tac/github.py), and the
# host run in docs/evidence/m0-host-run.md stays the acceptance evidence. This
# job is an early warning when a change breaks confinement on a clean Mac.
name: macos

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  seatbelt:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync the candidate environment
        run: uv sync --frozen
      - name: Build the deployed toolchain from its named source
        run: uv sync --frozen --no-editable --project .agents
      - name: Seatbelt confinement tests, none skipped for want of a sandbox
        # A test that skips for want of sandbox-exec proves nothing, so the
        # job fails on that skip reason as it fails on a test.
        shell: bash
        run: |
          uv run --frozen pytest -q -rs tests/test_runner_skeleton.py | tee "$RUNNER_TEMP/seatbelt.txt"
          if grep -q "needs macOS sandbox-exec" "$RUNNER_TEMP/seatbelt.txt"; then
            echo "::error::the Seatbelt tests skipped: sandbox-exec was not found"
            exit 1
          fi
