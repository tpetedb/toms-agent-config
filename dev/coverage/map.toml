# =============================================================================
# dev/coverage/map.toml: the coverage manifest (docs/DESIGN.md, section 13).
# One entry per condition `tac proof coverage --list` derives from the
# configuration and the source. `just coverage-proof` refuses a condition
# without an entry, an entry for no condition and a test id that does not
# collect, runs every named test, and fails a condition whose test failed or
# was skipped. Each entry:
#   condition: the derived id;
#   why: one line on what the tests prove about it, for the reviewer;
#   tests: pytest node ids; a bare id of a parametrized test takes every case;
#   probe, requires, live: a live probe of tac.proof.LIVE_PROBES (one, or a
#     dotted group such as C1) and what it needs; it runs through
#     `just dev-proof --require-live` on the host and never counts as passed here.
# =============================================================================
schema_version = 1

