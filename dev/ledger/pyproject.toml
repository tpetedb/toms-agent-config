[project]
name = "ledger"
version = "0.1.0"
description = "Ingest a CSV of expenses into DuckDB and print a monthly report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "click>=8.2",
  "duckdb>=1.3",
]

[project.scripts]
ledger = "ledger.cli:main"

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "ruff>=0.13",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
