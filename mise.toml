# The CLIs every checkout runs, pinned. Python and the Python tools are pinned by
# uv (.python-version, uv.lock), so they are not repeated here.
# mise asks the owner to trust this file once: `mise trust`, then `mise install`.
[tools]
uv = "0.12.18"
just = "1.58.0"
# The diagram renderer `just diagrams-render` runs through npx; it needs node
# 22.13 or later, which mise does not pin here (docs/diagrams/README.md).
"npm:@mermaid-js/mermaid-cli" = "12.0.0"
